[pytest]
testpaths = tests
python_files = test_*.py
addopts = --strict-markers -q
filterwarnings =
    error::DeprecationWarning:temporal_.*
    error::DeprecationWarning:retrieval
    error::DeprecationWarning:ingestion
    error::DeprecationWarning:vector_store
    error::DeprecationWarning:query_decomposition
